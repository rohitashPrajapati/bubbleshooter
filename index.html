<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DivineBits Bubble Shooter</title>
    <style>
        /* Score position for mobile */
        #score-mobile {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 12;
            color: #cfd6ff;
            font-size: 38px;
            font-family: Verdana, Arial, sans-serif;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            text-shadow: 0 2px 8px #0b0f1c;
            display: none;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0b0f1c;
            overflow: hidden;
            touch-action: none;
        }

        #viewport {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }

        @media (max-width: 600px) {

            html,
            body {
                height: 100vh;
                width: 100vw;
                min-height: 100vh;
                min-width: 100vw;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #0b0f1c;
            }

            #viewport {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                max-width: 100vw;
                max-height: 100vh;
                object-fit: contain;
                background: #0b0f1c;
                aspect-ratio: 11/16;
                display: block;
            }

            #score-mobile {
                display: block;
            }

            #pause-btn-container {
                top: 18px !important;
                right: 18px !important;
                gap: 8px !important;
            }

            #pause-btn,
            #sound-btn {
                padding: 7px 10px !important;
            }

            #pause-btn svg,
            #sound-btn svg {
                width: 18px !important;
                height: 18px !important;
            }

            /* Mobile-specific email popup styles */
            #email-popup-bg {
                width: 100vw !important;
                height: 100vh !important;
                box-shadow: none;
            }

            #email-popup-content {
                max-width: 90%;
            }
        }


        /* Email Popup Styles */
        #email-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.0);
            /* Black overlay for the rest of the screen */
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease-out;
        }

        #email-popup-bg {
            /* Constrain size to game canvas aspect ratio (11/16) */
            width: min(100vw, 100vh * 11 / 16);
            height: min(100vh, 100vw * 16 / 11);
            background: url('images/shooter_bg.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            /* Optional: slight shadow to separate from overlay */
        }

        #email-popup-content {
            position: relative;
            width: 90%;
            max-width: 400px;
            background: url('images/blank_message_board.png') no-repeat center center;
            background-size: 100% 100%;
            padding: 50px 30px 80px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 400px;
            justify-content: flex-start;
            animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #email-popup-close {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #email-popup-close:hover {
            transform: scale(1.1);
        }

        #email-popup h2 {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: #5d4037;
            font-size: 32px;
            margin-bottom: 25px;
            margin-top: 50px;
            text-shadow: 2px 2px 4px rgba(255, 179, 0, 0.5);
        }

        #email-popup input {
            width: 95%;
            padding: 15px;
            border-radius: 18px;
            border: none;
            font-size: 18px;
            outline: none;
            margin-bottom: 25px;
            text-align: left;
            font-family: sans-serif;
        }

        #email-popup p {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: #5d4037;
            font-size: 23px;
            margin-bottom: 30px;
            width: 90%;
            line-height: 1.4;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(255, 179, 0, 0.5);
        }

        #email-popup-submit {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s;
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
        }

        #email-popup-submit img {
            width: 90px;
            display: block;
        }

        #email-popup-submit:hover {
            transform: translateX(-50%) scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes scaleUp {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes springJump {
            0% {
                transform: scale(0.3) translateY(100px);
                opacity: 0;
            }

            50% {
                transform: scale(1.1) translateY(-30px);
                opacity: 1;
            }

            70% {
                transform: scale(0.9) translateY(10px);
            }

            90% {
                transform: scale(1.05) translateY(-5px);
            }

            100% {
                transform: scale(1) translateY(0);
            }
        }

        /* Info Popup Styles */
        #info-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease-out;
        }

        #info-popup-content {
            position: relative;
            width: 80%;
            max-width: 450px;
            background: url('images/blank_message_board.png') no-repeat center center;
            background-size: 100% 100%;
            padding: 60px 40px 50px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 225px;
            justify-content: flex-start;
            animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #info-popup-close {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #info-popup-close:hover {
            transform: scale(1.1);
        }

        #info-popup h2 {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: #5d4037;
            font-size: 28px;
            margin-bottom: 25px;
            margin-top: 30px;
            line-height: 1.3;
            font-style: italic;
            text-shadow: 2px 2px 4px rgba(255, 179, 0, 0.5);
        }

        #info-popup p {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: #523232;
            font-size: 22px;
            margin-bottom: 30px;
            font-weight: bold;
            font-style: italic;
            text-shadow: 1px 1px 3px rgba(255, 179, 0, 0.5);
        }

        #info-popup-play {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s;
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
        }

        #info-popup-play img {
            width: 80px;
            display: block;
        }

        #info-popup-play:hover {
            transform: translateX(-50%) scale(1.1);
        }

        /* Congratulations Popup Styles */
        #congrats-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.0);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease-out;
        }

        #congrats-popup-bg {
            width: min(100vw, 100vh * 11 / 16);
            height: min(100vh, 100vw * 16 / 11);
            background: url('images/shooter_bg.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #congrats-popup-content {
            position: relative;
            width: 85%;
            max-width: 450px;
            background: url('images/congo_popup.png') no-repeat center center;
            background-size: 100% 100%;
            padding: 80px 40px 80px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 400px;
            justify-content: flex-start;
            animation: springJump 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #congrats-popup h2 {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: #4CAF50;
            font-size: 40px;
            margin-bottom: 10px;
            margin-top: 60px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 179, 0, 0.5);
        }

        #congrats-score {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: #4CAF50;
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(255, 179, 0, 0.5);
        }

        #congrats-message {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: #5d4037;
            font-size: 24px;
            margin-bottom: 30px;
            width: 90%;
            line-height: 1.4;
            font-weight: bold;
            font-style: italic;
            text-shadow: 1px 1px 3px rgba(255, 179, 0, 0.5);
        }

        #congrats-buttons {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
        }

        #congrats-restart,
        #congrats-cart {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s;
        }

        #congrats-restart img,
        #congrats-cart img {
            width: 80px;
            display: block;
        }

        #congrats-restart:hover,
        #congrats-cart:hover {
            transform: scale(1.1);
        }

        /* Sorry Popup Styles */
        #sorry-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.0);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease-out;
        }

        #sorry-popup-bg {
            width: min(100vw, 100vh * 11 / 16);
            height: min(100vh, 100vw * 16 / 11);
            background: url('images/shooter_bg.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #sorry-popup-content {
            position: relative;
            width: 75%;
            max-width: 400px;
            background: url('images/sorry_popup.png') no-repeat center center;
            background-size: 100% 100%;
            padding: 50px 40px 50px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 350px;
            justify-content: flex-start;
            animation: springJump 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #sorry-popup h2 {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: #d32f2f;
            font-size: 40px;
            margin-bottom: 20px;
            margin-top: 60px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 179, 0, 0.5);
        }

        #sorry-message {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: #5d4037;
            font-size: 24px;
            margin-bottom: 30px;
            width: 90%;
            line-height: 1.4;
            font-weight: bold;
            font-style: italic;
            text-shadow: 1px 1px 3px rgba(255, 179, 0, 0.5);
        }

        #sorry-buttons {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
        }

        #sorry-restart,
        #sorry-home {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s;
        }

        #sorry-restart img,
        #sorry-home img {
            width: 80px;
            display: block;
        }

        #sorry-restart:hover,
        #sorry-home:hover {
            transform: scale(1.1);
        }

        /* Mobile-specific congrats popup styles */
        @media (max-width: 600px) {

            #congrats-popup-bg,
            #sorry-popup-bg {
                width: 100vw !important;
                height: 100vh !important;
                box-shadow: none;
            }

            #congrats-popup-content {
                max-width: 90%;
                padding: 60px 20px 60px 20px;
                min-height: 320px;
            }

            #sorry-popup-content {
                max-width: 80%;
                padding: 50px 20px 50px 20px;
                min-height: 250px;
            }

            #congrats-popup h2,
            #sorry-popup h2 {
                font-size: 28px;
                margin-top: 50px;
            }

            #congrats-score {
                font-size: 32px;
                margin-bottom: 15px;
            }

            #congrats-message,
            #sorry-message {
                font-size: 18px;
                margin-bottom: 20px;
            }

            #congrats-restart img,
            #congrats-cart img,
            #sorry-restart img,
            #sorry-home img {
                width: 65px;
            }

            #congrats-buttons,
            #sorry-buttons {
                bottom: -30px;
                gap: 30px;
            }
        }
    </style>
    <script type='text/javascript' src='bubble-shooter-example.js'></script>
</head>

<body>
    <canvas id="viewport"></canvas>
    <div id="score-mobile"></div>
    <!-- Pause/Resume Button -->
    <div id="pause-btn-container"
        style="position: absolute; top: 24px; right: 32px; z-index: 10; display: flex; gap: 12px;">
        <button id="pause-btn"
            style="background: #fff; border-radius: 50px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.12); padding: 12px 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <span id="pause-icon">
                <svg fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28"
                    style="display:block; color:#3b59ff;">
                    <path d="M7.25 6.125h4.5v15.75h-4.5V6.125Zm9 0h4.5v15.75h-4.5V6.125Z" fill="currentColor"></path>
                </svg>
            </span>
        </button>
        <button id="sound-btn"
            style="background: #fff; border-radius: 50px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.12); padding: 12px 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <span id="sound-icon">
                <svg id="sound-on-svg" fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28"
                    height="28" style="display:block; color:#3b59ff;">
                    <path
                        d="M20.522 7.228a6.74 6.74 0 0 1 0 9.544M7.5 15.75H3a.75.75 0 0 1-.75-.75V9A.75.75 0 0 1 3 8.25h4.5L14.25 3v18L7.5 15.75Zm0-7.5v7.5m10.369-5.869a2.99 2.99 0 0 1 0 4.238"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </span>
        </button>
    </div>
    <!-- Email Input Popup -->
    <div id="email-popup">
        <div id="email-popup-bg">
            <div id="email-popup-content">
                <img id="email-popup-close" src="images/close.png" alt="Close">
                <h2>Your email</h2>
                <input type="email" id="user-email" placeholder="|" />
                <p>This email will be used to share your rewards and discounts.</p>
                <button id="email-popup-submit">
                    <img src="images/submit.png" alt="Submit">
                </button>
            </div>
        </div>
    </div>

    <!-- Info Popup -->
    <div id="info-popup">
        <div id="info-popup-content">
            <img id="info-popup-close" src="images/close.png" alt="Close">
            <h2>Pop the mithai and unlock real discounts.</h2>
            <p>1% off every 15000 points. Upto 5%</p>
            <button id="info-popup-play">
                <img src="images/play_button-min.png" alt="Play">
            </button>
        </div>
    </div>

    <!-- Congratulations Popup -->
    <div id="congrats-popup">
        <div id="congrats-popup-bg">
            <div id="congrats-popup-content">
                <h2>YOUR SCORE:</h2>
                <p id="congrats-score">0</p>
                <p id="congrats-message">We have added 1% discount to your account. Happy Shopping.</p>
                <div id="congrats-buttons">
                    <button id="congrats-restart">
                        <img src="images/restart-min.png" alt="Restart">
                    </button>
                    <button id="congrats-cart">
                        <img src="images/shoppingcart.png" alt="Cart">
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sorry Popup -->
    <div id="sorry-popup">
        <div id="sorry-popup-bg">
            <div id="sorry-popup-content">
                <h2>Tough Luck.</h2>
                <p id="sorry-message">We hope it was fun. Wanna try again?</p>
                <div id="sorry-buttons">
                    <button id="sorry-restart">
                        <img src="images/restart-min.png" alt="Restart">
                    </button>
                    <button id="sorry-home">
                        <img src="images/home-min.png" alt="Home">
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Paused Overlay -->
    <div id="paused-overlay"
        style="display:none; position: absolute; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.1); z-index:20; justify-content:center; align-items:center;">
        <div
            style="background:#fff; border-radius:24px; padding:40px 60px; text-align:center; box-shadow:0 4px 32px rgba(0,0,0,0.18);">
            <div
                style="font-size:32px; color:#ffb500; font-weight:bold; margin-bottom:18px; display:flex; align-items:center; justify-content:center; gap:10px;">
                <svg fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="32" height="32"
                    style="display:block; color:#ffb500;">
                    <path d="M7.25 6.125h4.5v15.75h-4.5V6.125Zm9 0h4.5v15.75h-4.5V6.125Z" fill="currentColor"></path>
                </svg>
                Paused
            </div>
            <button id="resume-btn"
                style="background: #3b59ff; color: #fff; border: none; border-radius: 50px; font-size: 22px; font-weight: bold; padding: 16px 48px; cursor: pointer; display:flex; align-items:center; justify-content:center; gap:10px;">
                <span id="play-icon">
                    <svg fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="28" height="28"
                        style="display:block; color:#fff;">
                        <path
                            d="M17.82 9.469 6.578 2.594a.625.625 0 0 0-.953.531v13.75a.625.625 0 0 0 .953.531l11.242-6.875a.618.618 0 0 0 0-1.062Z"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            fill="currentColor"></path>
                    </svg>
                </span>
                Resume
            </button>
        </div>
    </div>
</body>

</html>
